name: AfterClass checks
on:
  push:
    paths: ['afterclass/**', '.github/workflows/afterclass.yml']
  pull_request:
    paths: ['afterclass/**', '.github/workflows/afterclass.yml']
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: afterclass
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: afterclass/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: npm run build
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-traces
          path: afterclass/test-results
          retention-days: 7